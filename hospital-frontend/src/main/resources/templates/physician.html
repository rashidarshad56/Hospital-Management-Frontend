<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Physicians Directory</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
  <script>
    function rowNav(href){ if(href){ window.location = href; } }
  </script>
</head>
<body>
<header class="topbar">
  <h1>Physicians Directory</h1>
  <nav>
    <a th:href="@{/}">Home</a>
  </nav>
</header>

<main class="container">
  <a class="back" th:href="@{/}">← Back to Home</a>

  <div class="table-card" th:if="${physicians != null and #lists.size(physicians) > 0}">
    <table class="table">
      <thead class="table-head">
        <tr>
          <th>Employee ID</th>
          <th>Name</th>
          <th>Position</th>
          <th class="meta">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="physician : ${physicians}"
            th:attr="data-href=@{'/physician/' + ${physician.employeeId}}"
            th:onclick="|rowNav(this.getAttribute('data-href'))|">
          <td th:text="${physician.employeeId}">1</td>
          <td th:text="${physician.name}">Dr. John Doe</td>
          <td th:text="${physician.position}">Cardiologist</td>
          <td class="meta">Click row to view appointments →</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="table-card" th:if="${physicians == null or #lists.size(physicians) == 0}">
    <p style="padding:16px;">No physicians found.</p>
  </div>
</main>

<footer class="footer">© Hospital Portal</footer>
</body>
</html>
