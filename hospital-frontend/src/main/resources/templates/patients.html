<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Patients</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
  <script>
    function rowNav(href){ if(href){ window.location = href; } }
  </script>
</head>
<body>
<header class="topbar">
  <h1>Patients</h1>
  <nav>
    <a th:href="@{/}">Home</a>
  
  </nav>
</header>

<main class="container">
  <a class="back" th:href="@{/}">← Back to Home</a>

  <div class="table-card">
    <table class="table">
      <thead class="table-head">
        <tr>
          <th>SSN</th>
          <th>Name</th>
          <th>Phone</th>
          <th class="meta">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="patient : ${patients}"
            th:attr="data-href=@{'/patients/' + ${patient.ssn} + '/appointments'}"
            th:onclick="|rowNav(this.getAttribute('data-href'))|">
          <td th:text="${patient.ssn}">1001</td>
          <td th:text="${patient.name}">John Smith</td>
          <td th:text="${patient.phone}">999-999</td>
          <td class="meta">Click row to view appointments →</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<footer class="footer">© Hospital Portal</footer>
</body>
</html>
