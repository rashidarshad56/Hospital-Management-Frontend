<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Departments</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
  <script>
    function rowNav(href){ if(href){ window.location = href; } }
  </script>
</head>
<body>
<header class="topbar">
  <h1>Departments</h1>
  <nav>
    <a th:href="@{/}">Home</a>
    
  </nav>
</header>

<main class="container">
  <a class="back" th:href="@{/}">← Back to Home</a>

  <div class="table-card">
    <table class="table">
      <thead class="table-head">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th class="meta">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="dept : ${departments}"
            th:attr="data-href=@{'/departments/' + ${dept.id} + '/physicians'}"
            th:onclick="|rowNav(this.getAttribute('data-href'))|">
          <td th:text="${dept.id}">1</td>
          <td th:text="${dept.name}">Cardiology</td>
          <td class="meta">Click row to view physicians →</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<footer class="footer">© Hospital Portal</footer>
</body>
</html>
